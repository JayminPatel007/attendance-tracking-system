name: backend

on:
  push:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: apps/backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + test
        run: mvn -B -ntp verify
