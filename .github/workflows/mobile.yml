name: mobile

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Generate platform directories
        run: |
          flutter create --platforms=android,ios --project-name=sabha_attendance_mobile .
          # flutter create writes its own boilerplate test that references the
          # generated MyApp; we already have splash_test.dart against the real app.
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit + widget tests
        run: flutter test
