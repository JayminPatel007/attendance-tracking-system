spring:
  application:
    name: sabha-backend
  threads:
    # Virtual threads (issue #71, A1). The backend is request-per-thread and
    # JDBC-heavy on Boot 3.5.6 / Java 21 — every BFF read blocks on Postgres,
    # the textbook case for virtual threads. This also moves the @Scheduled cron
    # scanners (ADR-0021) onto virtual threads; they remain correct as each pass
    # re-derives its work and is self-healing.
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/sabha}
    username: ${SPRING_DATASOURCE_USERNAME:sabha}
    password: ${SPRING_DATASOURCE_PASSWORD:sabha}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:58080/realms/sabha}
      # Web BFF client (ADR-0022): the Angular app authenticates via this
      # server-side Authorization-Code client; tokens stay in the HttpSession.
      # Provider endpoints are spelled out (not issuer-uri) so the context starts
      # without an OIDC discovery fetch — important for tests that don't run
      # Keycloak. They derive from sabha.keycloak.issuer-uri, which Keycloak-backed
      # tests already override to their container.
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${SABHA_WEB_CLIENT_ID:sabha-web}
            client-secret: ${SABHA_WEB_CLIENT_SECRET:dev-web-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${sabha.keycloak.issuer-uri}/protocol/openid-connect/auth
            token-uri: ${sabha.keycloak.issuer-uri}/protocol/openid-connect/token
            jwk-set-uri: ${sabha.keycloak.issuer-uri}/protocol/openid-connect/certs
            user-info-uri: ${sabha.keycloak.issuer-uri}/protocol/openid-connect/userinfo
            user-name-attribute: sub

sabha:
  keycloak:
    issuer-uri: ${SABHA_KEYCLOAK_ISSUER_URI:http://localhost:58080/realms/sabha}
    admin-base-url: ${SABHA_KEYCLOAK_ADMIN_BASE_URL:http://localhost:58080}
    realm: ${SABHA_KEYCLOAK_REALM:sabha}
    admin-username: ${SABHA_KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${SABHA_KEYCLOAK_ADMIN_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
