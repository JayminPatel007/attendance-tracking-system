name: sabha_attendance_mobile
description: Sabha Attendance — mobile app for Sanchalak / Sah-Sanchalak (ADR-0003).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # OIDC Authorization Code + PKCE against Keycloak per ADR-0016.
  flutter_appauth: ^7.0.0

  # Backend HTTP client.
  http: ^1.2.0

  # Typed client generated from the backend OpenAPI spec (issue #73). Feature
  # clients migrate onto its models/operations incrementally; selection is first.
  sabha_api:
    path: ../packages/sabha_api

  # Local SQLite store for offline roster cache + pending-marking queue (ADR-0007).
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0

  # Hexagonal layering per ADR-0015: the app shell composes domain libraries.
  shared_kernel:
    path: ../packages/shared_kernel
  identity_domain:
    path: ../packages/identity_domain
  sabha_domain:
    path: ../packages/sabha_domain
  attendance_domain:
    path: ../packages/attendance_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Exercises real SQLite in unit tests without platform plugins.
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
