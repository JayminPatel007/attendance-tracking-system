server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Auth + BFF endpoints are handled by the Spring backend, not Angular.
    # Proxy them across the docker network to the `backend` service. We forward
    # the verbatim Host header ($http_host, which KEEPS the :4200 port — $host
    # would drop it) so Spring builds the OAuth redirect URI as
    # http://localhost:4200/login/oauth2/code/keycloak — the exact value
    # registered for the sabha-web client in realm-sabha.json.
    location ~ ^/(bff|oauth2|login|logout) {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    # Everything else is the Angular single-page app. Unknown paths fall back to
    # index.html so client-side routing (deep links, refresh) works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
