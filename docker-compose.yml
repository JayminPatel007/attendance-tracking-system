services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sabha
      POSTGRES_USER: sabha
      POSTGRES_PASSWORD: sabha
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabha -d sabha"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-sabha.json:/opt/keycloak/data/import/realm-sabha.json:ro
    ports:
      - "58080:8080"
      - "59000:9000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    build:
      context: ./apps/backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sabha
      SPRING_DATASOURCE_USERNAME: sabha
      SPRING_DATASOURCE_PASSWORD: sabha
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sabha
      SABHA_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/sabha
      SABHA_KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      SABHA_KEYCLOAK_REALM: sabha
      SABHA_KEYCLOAK_ADMIN_USERNAME: admin
      SABHA_KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
