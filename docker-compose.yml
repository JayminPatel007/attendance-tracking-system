services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sabha
      POSTGRES_USER: sabha
      POSTGRES_PASSWORD: sabha
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabha -d sabha"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sabha
      SPRING_DATASOURCE_USERNAME: sabha
      SPRING_DATASOURCE_PASSWORD: sabha
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
